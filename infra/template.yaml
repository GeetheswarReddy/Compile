AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Compile adaptive placement-preparation demo infrastructure.

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 256
    Timeout: 10
    CodeUri: ..
    Environment:
      Variables:
        QUOTAS_TABLE: !Ref QuotasTable
        LEARNERS_TABLE: !Ref LearnersTable
        MASTERY_TABLE: !Ref MasteryTable
        QUESTIONS_TABLE: !Ref QuestionsTable
        ATTEMPTS_TABLE: !Ref AttemptsTable
        TRACE_TABLE: !Ref TraceTable
        REFLECTIONS_TABLE: !Ref ReflectionsTable
        REFLECTION_TABLE_NAME: !Ref ReflectionsTable
        PREPARED_QUESTIONS_TABLE: !Ref PreparedQuestionsTable
        REFLECTION_BUCKET: !Ref ReflectionBucket
        S3_BUCKET: !Ref ReflectionBucket
        BEDROCK_MODEL_ID: !Ref BedrockModelId
    Tracing: PassThrough

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model identifier enabled in the deployment Region.

Resources:
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      EndpointConfiguration: REGIONAL
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Learner-Id'"
        AllowOrigin: "'*'"

  QuotasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: quotaId, AttributeType: S}]
      KeySchema: [{AttributeName: quotaId, KeyType: HASH}]

  LearnersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: learnerId, AttributeType: S}]
      KeySchema: [{AttributeName: learnerId, KeyType: HASH}]

  MasteryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: learnerId, AttributeType: S}
        - {AttributeName: topic, AttributeType: S}
      KeySchema:
        - {AttributeName: learnerId, KeyType: HASH}
        - {AttributeName: topic, KeyType: RANGE}

  QuestionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: questionId, AttributeType: S}]
      KeySchema: [{AttributeName: questionId, KeyType: HASH}]

  AttemptsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: learnerId, AttributeType: S}
        - {AttributeName: questionId, AttributeType: S}
      KeySchema:
        - {AttributeName: learnerId, KeyType: HASH}
        - {AttributeName: questionId, KeyType: RANGE}

  TraceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: learnerId, AttributeType: S}
        - {AttributeName: traceId, AttributeType: S}
      KeySchema:
        - {AttributeName: learnerId, KeyType: HASH}
        - {AttributeName: traceId, KeyType: RANGE}

  ReflectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: learnerId, AttributeType: S}
        - {AttributeName: questionId, AttributeType: S}
      KeySchema:
        - {AttributeName: learnerId, KeyType: HASH}
        - {AttributeName: questionId, KeyType: RANGE}

  PreparedQuestionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: learnerTopic, AttributeType: S}
        - {AttributeName: questionId, AttributeType: S}
      KeySchema:
        - {AttributeName: learnerTopic, KeyType: HASH}
        - {AttributeName: questionId, KeyType: RANGE}

  ReflectionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [GET, PUT, HEAD]
            AllowedHeaders: [Content-Type]
            ExposedHeaders: [ETag]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireReflectionAudioAfter30Days
            Status: Enabled
            Prefix: reflections/
            ExpirationInDays: 30

  SeedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ExecutionVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.80.0.0/24
      EnableDnsSupport: false
      EnableDnsHostnames: false

  ExecutionSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExecutionVpc
      CidrBlock: 10.80.0.0/28
      MapPublicIpOnLaunch: false

  ExecutionNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref ExecutionVpc

  ExecutionNetworkAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref ExecutionSubnet
      NetworkAclId: !Ref ExecutionNetworkAcl

  ExecutionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No usable ingress or egress for untrusted Python
      VpcId: !Ref ExecutionVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1
          ToPort: 1
          CidrIp: 127.0.0.1/32

  SandboxFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    DependsOn: ExecutionNetworkAclAssociation
    Properties:
      Handler: backend.execution_runner.handler
      Timeout: 8
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds: [!Ref ExecutionSecurityGroup]
        SubnetIds: [!Ref ExecutionSubnet]
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Deny
              Action: ec2:*
              Resource: '*'
              Condition:
                ArnEquals:
                  lambda:SourceFunctionArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-sandbox
      FunctionName: !Sub ${AWS::StackName}-sandbox

  ApiAdapterPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Data access for API Gateway adapters.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Query, dynamodb:Scan]
            Resource:
              - !GetAtt QuotasTable.Arn
              - !GetAtt LearnersTable.Arn
              - !GetAtt MasteryTable.Arn
              - !GetAtt QuestionsTable.Arn
              - !GetAtt AttemptsTable.Arn
              - !GetAtt TraceTable.Arn
              - !GetAtt ReflectionsTable.Arn
              - !GetAtt PreparedQuestionsTable.Arn

  ExecutionRunnerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.run_and_check
      Timeout: 25
      FunctionName: !Sub ${AWS::StackName}-execution-runner
      Environment:
        Variables:
          EXECUTION_FUNCTION_NAME: !Ref SandboxFunction
      Policies:
        - !Ref ApiAdapterPolicy
        - LambdaInvokePolicy: {FunctionName: !Ref SandboxFunction}
      Events:
        RunCheck: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /run-check, Method: post}}

  InitLearnerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.init_learner
      Policies: [!Ref ApiAdapterPolicy]
      Events:
        Init: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /learner/init, Method: post}}

  BaselineNextFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.baseline_next
      Policies: [!Ref ApiAdapterPolicy]
      Events:
        Next: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /baseline/next, Method: get}}

  BaselineSubmitFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.baseline_submit
      Timeout: 25
      Environment:
        Variables:
          EXECUTION_FUNCTION_NAME: !Ref SandboxFunction
      Policies:
        - !Ref ApiAdapterPolicy
        - LambdaInvokePolicy: {FunctionName: !Ref SandboxFunction}
      Events:
        Submit: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /baseline/submit, Method: post}}

  NextQuestionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.next_question
      Policies: [!Ref ApiAdapterPolicy]
      Events:
        Next: {Type: Api, Properties: {RestApiId: !Ref Api, Path: '/topic/{topicId}/next-question', Method: get}}

  PracticeHistoryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.practice_history
      Policies: [!Ref ApiAdapterPolicy]
      Events:
        History: {Type: Api, Properties: {RestApiId: !Ref Api, Path: '/topic/{topicId}/history', Method: get}}

  GenerateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.generate
      Environment:
        Variables:
          GENERATION_STATE_MACHINE_ARN: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine/${AWS::StackName}-generation
      Policies:
        - !Ref ApiAdapterPolicy
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref GenerationStateMachine
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt LearnersTable.Arn
      Events:
        Generate: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /generate, Method: post}}

  HintFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.next_hint
      Policies: [!Ref ApiAdapterPolicy]
      Events:
        Hint: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /hint, Method: post}}

  ReflectionCreateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.create_reflection
      Policies:
        - !Ref ApiAdapterPolicy
        - DynamoDBCrudPolicy: {TableName: !Ref ReflectionsTable}
        - S3CrudPolicy: {BucketName: !Ref ReflectionBucket}
      Events:
        Create: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /reflection, Method: post}}

  ReflectionGetFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.get_reflection
      Policies:
        - !Ref ApiAdapterPolicy
        - S3ReadPolicy: {BucketName: !Ref ReflectionBucket}
      Events:
        Get: {Type: Api, Properties: {RestApiId: !Ref Api, Path: '/reflection/{questionId}', Method: get}}

  ReflectionDeleteFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.delete_reflection
      Policies:
        - !Ref ApiAdapterPolicy
        - DynamoDBCrudPolicy: {TableName: !Ref ReflectionsTable}
        - S3CrudPolicy: {BucketName: !Ref ReflectionBucket}
      Events:
        Delete: {Type: Api, Properties: {RestApiId: !Ref Api, Path: '/reflection/{questionId}', Method: delete}}

  DemoTraceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.api_adapters.demo_trace
      Policies: [!Ref ApiAdapterPolicy]
      Events:
        Trace: {Type: Api, Properties: {RestApiId: !Ref Api, Path: /demo-trace, Method: get}}

  GenerateCandidateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.generation_handlers.generate_candidate
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref QuestionsTable}
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}

  HandleGeneratedCandidateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.generation_handlers.handle_generated_candidate
      Timeout: 18
      Environment:
        Variables:
          EXECUTION_FUNCTION_NAME: !Ref SandboxFunction
      Policies:
        - !Ref ApiAdapterPolicy
        - LambdaInvokePolicy: {FunctionName: !Ref SandboxFunction}
        - DynamoDBCrudPolicy: {TableName: !Ref PreparedQuestionsTable}
        - DynamoDBReadPolicy: {TableName: !Ref QuestionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref MasteryTable}

  GenerationStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Name: !Sub ${AWS::StackName}-generation
      DefinitionUri: statemachines/generation.asl.json
      DefinitionSubstitutions:
        GenerateCandidateArn: !GetAtt GenerateCandidateFunction.Arn
        HandleGeneratedCandidateArn: !GetAtt HandleGeneratedCandidateFunction.Arn
      Policies:
        - LambdaInvokePolicy: {FunctionName: !Ref GenerateCandidateFunction}
        - LambdaInvokePolicy: {FunctionName: !Ref HandleGeneratedCandidateFunction}

  SeedDeployFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: backend.seed_deploy.seed
      Timeout: 60
      Policies:
        - DynamoDBWritePolicy: {TableName: !Ref QuestionsTable}

  SeededQuestions:
    Type: Custom::SeededQuestions
    Properties:
      ServiceToken: !GetAtt SeedDeployFunction.Arn

Outputs:
  ApiBaseUrl:
    Description: API Gateway REST base URL for the Amplify SPA.
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1
  FrontendApiBaseUrl:
    Description: Set this value as VITE_API_BASE_URL in the frontend host.
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}/v1
  ApiId: {Value: !Ref Api}
  ReflectionBucketName: {Value: !Ref ReflectionBucket}
  SeedBucketName: {Value: !Ref SeedBucket}
  GenerationStateMachineArn: {Value: !Ref GenerationStateMachine}
